<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="prabat.js" type="module" defer></script>
    <!-- <link rel="stylesheet" href="prabat.css" /> -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="%BASE_URL%">

    <!-- Favicon -->
    <link rel="icon" href="./logos/cipcip.svg" />
    <link rel="icon" href="./logos/cipcip.svg" type="image/svg+xml" />
    <title>PraBat</title>
  </head>

  <body>
    <div id="flex-wrapper" style="background-color: #f2f9ff" >
      <div class="flex-item">
        <h2
          id="heading-fullscreen"
          style="
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
            text-align: center;
            font-size: 1.5em;
          "
        ><p id="heading-fullscreen"></p></h2>

        

        <div class="main-flex-sheet">
          <div class="flex-sheet trials" style="display: none" >
            <audio id="testsound" src="audio/testsound.mp3"></audio>
          </div>

          <div id="between-trials" class="flex-sheet">
            <img
              id="between-trials-background"
              data-img="backgrounds/background_task.svg"
              style="opacity: 0;"
              />
            <h2
              id="heading-testsound"
              style="
                position: absolute;
                top: 40%;
                left: 50%;
                transform: translateX(-50%) translateY(-50%);
                text-align: center;
                display: none;
                font-size: 1.5em;
              "
            ><p id="noiseQuestion"></p></h2>
          </div>          

          <!-- START -->
          <div class="flex-sheet trials" style="display: none; height: 100%"> <!-- sistemare!!-->
            <audio data-audio="intro.mp3"></audio>
            <img
                id="background-start"
                src=""
                style="opacity: 1; 
                height: 100vh; 
                width: 100%; 
                margin-top: 0; 
                position: absolute; 
                top: 0; 
                left: 0; 
                z-index: -1;
                display: block;"
            />
            <div class="character" style="position: relative;">
              <img
              id="character"
              class="upper-left"
              src="images/agents/girl.svg"
              style="opacity: 0; position: relative; z-index: 1;"
              />
            </div>
          </div>

          <!-- FAMILIARIZATION TRIALS -->
          <!-- Familiarization trial 1-->

          <div class="flex-sheet trials mutex-noun" style="display: none; height: 100%"> 
            <audio class="prompt" data-audio="cat.mp3"></audio>
            <audio class="response" data-audio="LetsGo.mp3"></audio>
            <img
                id="background"
                data-img="backgrounds/background_task.svg"
            />
            <img
                id="background-talking"
                data-img="backgrounds/background_task_talking.svg"
            />
            <div class="character" style="position: relative;">
              <img
              id="character"
              class="upper-left"
              src="images/agents/girl.svg"
              style="opacity: 0; position: relative; z-index: 1;"
              />
            </div>
            <div class="row">
              <div id="left">
                <img
                  class="object"
                  data-word-category="dist1"
                  src="images/objects/banana.svg"
                />
              </div>
              <div id="center">
                <img
                  class="object"
                  data-word-category="target"
                  src="images/objects/cat.svg"
                />
              </div>
              <div id="right">
                <img
                  class="object"
                  data-word-category="dist2"
                  src="images/objects/helicopter.svg"
                />
              </div>
            </div>
          </div>



          <!-- end of main-flex-sheet -->
        </div>
        
      
      
        <div class="button-row-wrapper" style="display: flex; justify-content: center; align-items: center; gap: 2em; margin-top: auto;">
          <svg
              id="svg"
              xmlns="http://www.w3.org/2000/svg"
              width="80px"
              height="80px"
              viewBox="0 0 394.79 394.79"
              style="display: block;"
            >
              <g id="speaker" visibility="hidden">
              <circle
                id="speaker-circle"
                cx="197.4"
                cy="197.4"
                r="197.4"
                fill="#006c66"
                fill-opacity="0.6"
              />
              <g id="speaker-sign">
                <path
                d="M728.7,1341.46a8.92,8.92,0,0,0-9.11.35l-80.12,52H609.86a8.91,8.91,0,0,0-8.91,8.91v78.09a8.91,8.91,0,0,0,8.91,8.91h29.61l80.12,52a8.91,8.91,0,0,0,13.77-7.47v-185A8.9,8.9,0,0,0,728.7,1341.46Z"
                transform="translate(-532.7 -1240.32)"
                fill="#fff"
                />
                <path
                d="M758.17,1504.85a6.24,6.24,0,0,0,2.26-.43c20.41-7.92,34.12-32.41,34.12-60.93,0-25.23-11.11-48-28.32-58.13a6.25,6.25,0,1,0-6.32,10.78c13.45,7.89,22.15,26.47,22.15,47.35,0,23-10.76,43.3-26.16,49.28a6.25,6.25,0,0,0,2.27,12.08Z"
                transform="translate(-532.7 -1240.32)"
                fill="#fff"
                />
                <path
                d="M774.48,1530.91a6.2,6.2,0,0,0,2.26-.43c28.67-11.13,48.69-47.14,48.69-87.57,0-36.37-15.9-69.19-40.51-83.61a6.25,6.25,0,0,0-6.32,10.79c20.86,12.22,34.34,40.8,34.34,72.82,0,35.39-16.75,66.61-40.72,75.92a6.25,6.25,0,0,0,2.26,12.08Z"
                transform="translate(-532.7 -1240.32)"
                fill="#fff"
                />
                <path
                d="M791.28,1555.75a6.32,6.32,0,0,1-2.29-12.21c32.65-12.67,55.45-54.23,55.45-101.07,0-42.22-18.2-80.16-46.36-96.67a6.31,6.31,0,1,1,6.38-10.89c32,18.72,52.61,60.94,52.61,107.56,0,51.93-26.11,98.33-63.5,112.85A6.36,6.36,0,0,1,791.28,1555.75Z"
                transform="translate(-532.7 -1240.32)"
                fill="#fff"
                />
              </g>
              </g>
            </svg>
            <button type="button" class="custom-button" id="prabat-button" style="padding: 15px 20px;" disabled>
              <span id="continue"><strong></strong></span>
            </button>
        </div>
        <!-- <a href="https://www.eva.mpg.de/imprint/" target="_blank">Impressum</a> -->
       <!-- end flex-item -->
      </div>
     <!-- end flex-wrapper -->
    </div>
  </body>
</html>
